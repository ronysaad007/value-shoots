name: Sync assets from Drive
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assets-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: (which pdftoppm && which gs || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils ghostscript)) && pip install -q pillow
      - run: python tools/sync_assets.py
      - name: Commit changes
        run: |
          git add assets
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="Assets sync" -c user.email="actions@users.noreply.github.com" commit -qm "Sync assets from Drive"
          git pull -q --rebase && git push -q
