name: Geocode client clinics
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/geocode.py
      - run: python tools/build_coverage.py
      - name: Commit
        run: |
          git add derma/geo.json coverage/data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="Geocode bot" -c user.email="actions@users.noreply.github.com" commit -qm "Geocode client clinics"
          git pull -q --rebase --autostash && git push -q
