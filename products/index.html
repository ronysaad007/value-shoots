function tiles(items){return '<div class="rich-grid">'+items.map((x,i)=>'<article class="icon-tile"><div class="icon-badge">'+icon(i)+'</div><div><h3>'+esc(L(x.title||x.name))+'</h3>'+(x.description?'<p class="muted">'+esc(L(x.description))+'</p>':'')+'</div></article>').join('')+'</div>'}

function meaningKey(value,kind='benefit'){const text=String(typeof value==='object'?value?.en:value||'').toLowerCase();if(kind==='ingredient'){
 if(/hyaluronic|weight ha|هيالورونيك/.test(text))return 'ha';
 if(/peptide|ببتيد/.test(text))return 'peptide';
 if(/gaba|gamma-aminobutyric/.test(text)&&!/(vitamin|فيتامين)/.test(text))return 'gaba';
 if(/vitamin|ascorbyl|riboflavin|فيتامين|ريبوفلافين/.test(text))return /riboflavin|b2|ريبوفلافين/.test(text)&&!/(vitamin|فيتامين)/.test(text)?'b2':/ascorbyl/.test(text)?'vitamin-c':/\bc\b|\bb2\b/.test(text)?'vitamins':'vitamin-group';
 if(/amino|glycine|proline|lysine|leucine|phenylalanine|arginine|valine|threonine|ميثيونين|أمينية/.test(text))return 'amino';
 if(/lipid|lipophilic|squalane|myristate|دهني|دهون/.test(text))return 'lipid';
 if(/seaweed|طحالب/.test(text))return 'seaweed';
 if(/oil|butter|lipid|زيت|زبدة/.test(text))return 'lipid';
 if(/antioxidant|أكسدة/.test(text))return 'antioxidant';
 if(/trichloroacetic|tca/.test(text))return 'tca';
 return 'ingredient';
 }
 if(/lipid|lipophilic|hydro-lipidic|barrier|film|غشاء|الدهني/.test(text))return 'barrier';
 if(/exfoliat|peeling|تقشير/.test(text))return 'exfoliation';
 if(/renewal|تجدد/.test(text))return 'renewal';
 if(/fine line|wrinkle|تجاعيد|خطوط/.test(text))return 'wrinkles';
 if(/elastic|مرونة/.test(text))return 'elasticity';
 if(/hydration|dehydrat|hydrat|hyaluronic|dry skin|ترطيب|جفاف|هيالورونيك/.test(text))return 'hydration';
 if(/oily skin|دهنية/.test(text))return 'balance';
 if(/comfort|nourish|post-treatment|راحة|تغذية/.test(text))return 'comfort';
 if(/antioxidant|oxidative|environment|أكسدة|بيئي/.test(text))return 'antioxidant';
 if(/photoaging|sun|شمس/.test(text))return 'sun-care';
 if(/uneven tone|pigment|acne|تصبغ|حبوب|تفاوت/.test(text))return 'tone';
 if(/texture|rough|smooth|scarring|quality|ملمس|خشونة|ناعم|ندب/.test(text))return 'texture';
 if(/radiance|brighter|dull|tired|إشراق|بهتان|مرهق/.test(text))return 'radiance';
 if(/hands|body areas|جسم|يدين/.test(text))return 'areas';
 if(/hydrophilic|محب للماء/.test(text))return 'hydration';
 if(/nts|filtration|ترشيح/.test(text))return 'filtration';
 return 'reference';
}

else if(adminTab==='general'){c.innerHTML='<div class="box"><div class="editor-grid">'+['title','subtitle','description','sideNote','footer'].map(k=>bilingual(t(k),draft.settings[k],k,k==='description'||k==='sideNote'?'textarea':'text')).join('')+'</div></div><div class="box" style="margin-top:20px"><h2>'+t('export')+'</h2><p class="muted">'+t('backupNote')+'</p><div class="row"><button id="export">'+t('export')+'</button><button id="import">'+t('import')+'</button></div></div>';c.insertAdjacentHTML('beforeend',companyEditor()+partnersEditor());bindFields(draft.settings);bindPartnersEditor();$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(draft,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='value-product-hub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());if(!Array.isArray(d.products)||!Array.isArray(d.brands)||!Array.isArray(d.categories)||!d.settings)throw Error('Invalid backup');if(!confirm(lang==='ar'?'استبدال المحتوى الحالي بهذه النسخة؟':'Replace current content with this backup?'))return;d.settings.company??=structuredClone(data.settings.company);draft=d;editing=draft.products[0]?.id;markDirty();renderAdmin()}catch(e){toast(e.message,true)}};f.click()}}

else{c.innerHTML='<div class="box login"><h2>'+t('changePassword')+'</h2><form id="change-password"><label class="field"><span>'+t('newPassword')+'</span><input id="new-password" type="password" minlength="6" autocomplete="new-password" required></label><button class="primary">'+t('changePassword')+'</button></form></div>';$('#change-password').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('password',{method:'POST',body:JSON.stringify({password:$('#new-password').value})});$('#new-password').value='';toast(lang==='ar'?'تم تغيير كلمة السر':'Password updated')}catch(e){toast(e.message,true)}finally{b.disabled=false}}}
$('#save').onclick=save;$('#preview').onclick=goHome;$('#logout').onclick=async()=>{if(dirty&&!confirm(t('unsaved')+' — '+t('logout')+'?'))return;try{await api('logout',{method:'POST'});admin=false;dirty=false;draft=null;renderAdmin()}catch(e){toast(e.message,true)}};document.querySelectorAll('[data-admin-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.adminTab;renderAdmin()})}
function markDirty(){dirty=true;if($('#save-status'))$('#save-status').textContent=t('unsaved')}
function bindFields(obj){document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{const v=el.type==='checkbox'?el.checked:el.type==='number'?+el.value:el.value;if(el.dataset.field==='id'){if(!/^[a-z0-9-]+$/.test(v))return;editing=v}writePath(obj,el.dataset.field,v);markDirty()});document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>{const input=document.createElement('input');input.type='file';input.accept=(b.dataset.upload==='document'||b.dataset.upload.startsWith('documents.'))?'application/pdf':'image/png,image/jpeg,image/webp';input.onchange=async()=>{if(!input.files[0])return;const f=new FormData();f.append('file',input.files[0]);b.disabled=true;try{const r=await api('upload',{method:'POST',body:f});writePath(obj,b.dataset.upload,r.url);markDirty();renderAdmin()}catch(e){toast(e.message,true)}finally{b.disabled=false}};input.click()})}
async function save(){const b=$('#save');b.disabled=true;try{const r=await api('catalog',{method:'PUT',body:JSON.stringify({data:draft,version})});data=structuredClone(draft);version=r.version;dirty=false;toast(t('success'));renderAdmin()}catch(e){if(e.message.includes('sign in')){admin=false;renderAdmin()}toast(e.message,true)}finally{if($('#save'))$('#save').disabled=false}}
$('#home').onclick=goHome;$('#catalog-nav').onclick=()=>openCatalogue();$('#language').onclick=()=>{lang=lang==='en'?'ar':'en';localStorage.setItem('va-lang',lang);render()};$('#settings').onclick=enterAdmin;window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
async function init(){header();try{const r=await api('catalog');data=r.data;version=r.version;favorites=new Set([...favorites].filter(id=>data.products.some(p=>p.id===id)));const id=location.hash.match(/^#product\/([a-z0-9-]+)$/)?.[1];if(id)openProduct(id);else{if(location.hash==='#catalog')view='catalog';render();if(location.hash==='#settings'){history.replaceState(null,'',location.pathname);enterAdmin()}}registerTools()}catch(e){$('#app').innerHTML='<main><div class="empty"><h2>'+t('loadError')+'</h2><button id="retry">'+t('retry')+'</button></div></main>';$('#retry').onclick=init}}
function registerTools(){}
let offlineRegistration=null,offlinePrompt=null,offlineSaving=false,offlineState=null,offlineSyncing=false;
const offlineEnabled=()=>localStorage.getItem('va-offline-enabled')==='yes';
function offlineAssetURL(url){return url}
function offlineRequest(type,onProgress=()=>{}){return new Promise(async(resolve,reject)=>{try{const registration=offlineRegistration||await navigator.serviceWorker.ready;const worker=registration.active;if(!worker)throw Error('worker-not-ready');const channel=new MessageChannel();const timer=setTimeout(()=>{channel.port1.close();reject(Error('download-timeout'))},180000);channel.port1.onmessage=event=>{const message=event.data;if(message.type==='PROGRESS'){onProgress(message);return}clearTimeout(timer);channel.port1.close();if(message.type==='ERROR'){offlineState=message.state;reject(Error(message.reason));return}resolve(message)};worker.postMessage({type},[channel.port2])}catch(error){reject(error)}})}
function offlineBanner(){let el=document.getElementById('offline-panel');if(!el){el=document.createElement('aside');el.id='offline-panel';el.setAttribute('role','region');document.body.append(el)}const enabled=offlineEnabled(),saved=!!offlineState;el.dir=lang==='ar'?'rtl':'ltr';el.innerHTML='<button class="offline-dismiss" aria-label="'+say('Close','إغلاق')+'">×</button><div class="offline-heading"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 6v9m-3-3 3 3 3-3M10 19h4"/></svg><strong>'+say('Value, wherever you are.','فاليو معك، أينما كنت.')+'</strong></div><p>'+(!enabled?say('Save the site, images and added PDFs on this device. Use the latest saved version without internet.','احفظ الموقع والصور وملفات PDF المضافة على هالجهاز، وافتح آخر نسخة محفوظة بدون إنترنت.'):saved?say('Your offline copy is saved. It checks for updates when you open the site with internet.','نسختك محفوظة. تتحدّث عند فتح الموقع بوجود إنترنت.'):say('Finish saving your offline copy.','أكمل حفظ النسخة للأوفلاين.'))+'</p><div id="offline-progress" role="status" aria-live="polite"></div><div class="offline-actions"><button id="offline-save" class="primary">'+(enabled?say('Update offline copy','تحديث النسخة المحفوظة'):say('Save for offline use','حفظ للاستخدام أوفلاين'))+'</button><button id="offline-install">'+say('Add to home screen','إضافة للشاشة الرئيسية')+'</button></div><small id="offline-help">'+say('Keep this page open until saving finishes. External reference websites need internet.','خلي الصفحة مفتوحة حتى يكتمل الحفظ. مواقع المراجع الخارجية تحتاج إنترنت.')+'</small>';el.querySelector('.offline-dismiss').onclick=()=>{localStorage.setItem('va-offline-dismissed','yes');el.remove()};el.querySelector('#offline-save').onclick=saveOfflineCopy;el.querySelector('#offline-install').onclick=installOfflineApp;updateOfflineButton()}
function updateOfflineButton(){const b=document.getElementById('offline-access');if(b){b.textContent=offlineEnabled()?say('Offline copy','نسخة أوفلاين'):say('Save offline','حفظ أوفلاين');b.onclick=offlineBanner}const install=document.getElementById('offline-install');if(install)install.hidden=!offlineEnabled()||!!navigator.standalone||window.matchMedia('(display-mode: standalone)').matches}
function offlineProgress(message){const el=document.getElementById('offline-progress');if(el)el.textContent=say('Saving ','جارٍ الحفظ ')+Math.round(message.completed/Math.max(1,message.total)*100)+'%';}
async function ensureOfflineWorker(){if(!('serviceWorker' in navigator)||!window.isSecureContext)throw Error('unsupported');offlineRegistration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;return offlineRegistration}
async function saveOfflineCopy(){if(offlineSaving||offlineSyncing)return;offlineSaving=true;const button=document.getElementById('offline-save');if(button)button.disabled=true;try{if(!navigator.onLine)throw Error('network');await ensureOfflineWorker();offlineProgress({completed:0,total:1});const r=await offlineRequest('SAVE_OFFLINE',offlineProgress);offlineState=r;localStorage.setItem('va-offline-enabled','yes');navigator.storage?.persist?.().catch(()=>{});offlineBanner();document.getElementById('offline-progress').textContent=say('Saved. Ready without internet.','تم الحفظ. جاهز بدون إنترنت.')}catch(error){const el=document.getElementById('offline-progress');if(el)el.textContent=error.message==='storage'?say('Not enough storage. Free some space and try again.','المساحة غير كافية. فرّغ مساحة وأعد المحاولة.'):say('Saving did not finish. Your previous copy is kept; reconnect and retry.','لم يكتمل الحفظ. النسخة السابقة محفوظة؛ اتصل بالإنترنت وأعد المحاولة.')}finally{offlineSaving=false;const b=document.getElementById('offline-save');if(b)b.disabled=false}}
async function installOfflineApp(){if(offlinePrompt){const prompt=offlinePrompt;offlinePrompt=null;await prompt.prompt();await prompt.userChoice;return}const el=document.getElementById('offline-help');if(el)el.textContent=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1)?say('In Safari: Share → Add to Home Screen.','في Safari: مشاركة ← إضافة إلى الشاشة الرئيسية.'):say('Open your browser menu and choose Install app or Add to Home screen, if available.','افتح قائمة المتصفح واختر تثبيت التطبيق أو إضافة للشاشة الرئيسية إذا كان الخيار متاحاً.')}
async function syncOfflineCopy(){if(!offlineEnabled()||!navigator.onLine||offlineSaving||offlineSyncing)return;offlineSyncing=true;try{await ensureOfflineWorker();const r=await offlineRequest('SYNC_OFFLINE');if(r.type==='READY')offlineState=r;}catch(error){}finally{offlineSyncing=false}}
async function initOffline(){updateOfflineButton();if(!('serviceWorker' in navigator)||!window.isSecureContext)return;window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();offlinePrompt=event});window.addEventListener('online',()=>{syncOfflineCopy();if(view!=='admin')init()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncOfflineCopy()});if(offlineEnabled()){try{await ensureOfflineWorker();offlineState=(await offlineRequest('OFFLINE_STATUS')).state;if(!offlineState){localStorage.removeItem('va-offline-enabled');offlineBanner()}else syncOfflineCopy()}catch(error){}}else if(localStorage.getItem('va-offline-dismissed')!=='yes')offlineBanner()}

init();initOffline();
</script></body></html>
