$('m-c').onclick=()=>{st.mode='c';st.limit=60;setSeg('m-','c',['c','d']);render()};
$('m-d').onclick=()=>{st.mode='d';st.limit=60;setSeg('m-','d',['c','d']);render()};
CITIES.forEach(cc=>$('c-'+cc).onclick=()=>setCity(cc));
SPS.forEach(s=>$('s-'+s).onclick=()=>{st.spec=s;st.limit=60;setSeg('s-',s,SPS);render()});
let tm;$('q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=e.target.value;st.limit=60;render()},120)});
$('area').onchange=e=>{st.area=e.target.value;st.limit=60;render()};
$('sort').onchange=e=>{st.sort=e.target.value;render()};
[['f-priv','priv'],['f-hosp','hosp'],['f-tel','tel'],['f-fav','fav']].forEach(([id,k])=>$(id).onclick=()=>{st[k]=!st[k];$(id).setAttribute('aria-pressed',String(st[k]));st.limit=60;render()});
$('list').addEventListener('click',e=>{
  if(e.target.closest('a.web'))return;
  const m=e.target.closest('#more');if(m){st.limit+=60;render();return}
  const f=e.target.closest('[data-fav]');if(f){e.preventDefault();const c=C[+f.dataset.fav];FAV.has(c.n)?FAV.delete(c.n):FAV.add(c.n);saveFav();f.closest('details').outerHTML=clinicCard(c,norm(st.q),true);return}
  const g=e.target.closest('[data-goto]');if(g){const c=C[+g.dataset.goto];st.mode='c';setSeg('m-','c',['c','d']);st.q=c.n;$('q').value=c.n;st.area='';$('area').value='';st.priv=false;$('f-priv').setAttribute('aria-pressed','false');render();window.scrollTo({top:0,behavior:'smooth'})}
});
$('copy').onclick=async()=>{
  const x=t();
  const rows=[['City','Clinic','Area','Phone','Address','Rating','Name','Role','Level','Licence']];
  const push=(c,d)=>rows.push([CITY[c.ct].en,c.n,c.ar||'',c.tel||'',c.a||'',c.r||'',d.n,T.en.sp[d.s],T.en.lv[d.lv]||'',d.l||'']);
  if(st.mode==='c'){for(const c of window.__res)for(const d of c.docs.filter(docOk))push(c,d)}
  else{for(const d of window.__res)push(C[d.c],d)}
  const tsv=rows.map(r=>r.map(v=>String(v).replace(/\t/g,' ')).join('\t')).join('\n');
  const b=$('copy');try{await navigator.clipboard.writeText(tsv);b.textContent=x.copied}catch(err){b.textContent=x.copyFail}
  setTimeout(()=>b.textContent=t().copy,3000)};

var moveBtn=()=>'';
setCity('d');applyLang();
</script>
